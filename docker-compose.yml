version: '3.8'
services:
  app:
    image: goalsetter09/squadus-server:v3
    platform: linux/amd64/v3
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./application.yml:/app/config/application.yml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1324
      MYSQL_DATABASE: squadus
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  db_data:
